[package]
name = "pi-oven"
version = "0.1.0"
edition = "2021"
description = "Web UI server for the pi coding agent"
license = "Apache-2.0"

[dependencies]
tower-http = { version = "0.6", features = ["cors"] }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3.34"
mime_guess = "2.0.5"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[profile.release]
# smaller and a little faster, at the price of a longer release build
lto = "thin"
codegen-units = 1
strip = true
